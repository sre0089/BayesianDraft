[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bayesiandraft"
version = "0.1.0"
description = "A local-first probabilistic fantasy football draft optimizer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "pydantic>=2.7",
  "polars>=1.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["bayesiandraft", "apps/api/src/bayesiandraft_api"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests"]
pythonpath = [".", "apps/api/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["bayesiandraft", "apps/api/src"]
